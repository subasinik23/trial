name: Build and Deploy Scraper App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build and start containers

      run: |
        docker-compose build
        docker-compose up -d
        
    - name: Check running containers
      run: docker ps
      
    # Optional: Run tests against your running container
    - name: Test the application
      run: |

        sleep 10
        curl -s http://localhost:8501 || echo "Application not responding"
        
    # If you want to deploy to a server, you would add deployment steps here
    # For example, using SSH to connect to your server and pull/restart containers
